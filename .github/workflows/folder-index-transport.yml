name: Verify folder patch transport
on:
  push:
    branches: [perf/folder-index]
    paths: [.github/workflows/folder-index-transport.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export concurrent main changes for compatibility review
        run: |
          mkdir /tmp/main-review
          git rev-parse origin/main > /tmp/main-review/sha.txt
          git diff 3123ec3ad374b2bf1dedef1eb0a52d0823611198 origin/main -- app.py static/app.js tests/test_folder_previews.py > /tmp/main-review/main.diff
          git show origin/main:app.py > /tmp/main-review/app.py
          git show origin/main:static/app.js > /tmp/main-review/app.js
          git show origin/main:tests/test_folder_previews.py > /tmp/main-review/test_folder_previews.py
      - uses: actions/upload-artifact@v4
        with:
          name: folder-main-compatibility
          path: /tmp/main-review/
          retention-days: 1
