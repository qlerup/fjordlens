name: Folder index checks
on:
  push:
    branches: [perf/folder-index]
    paths: [.folder-index-part-4.b64, .folder-index-corrections.json, .github/workflows/folder-index-check.yml, .folder-index-fix.py]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply implementation in isolated checkout
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          lines = ''.join(pathlib.Path(f'.folder-index-part-{i}.b64').read_text() for i in range(1,5)).splitlines()
          for number, value in json.loads(pathlib.Path('.folder-index-corrections.json').read_text()).items():
              lines[int(number)-1] = value
          data = gzip.decompress(base64.b64decode(''.join(lines)))
          assert hashlib.sha256(data).hexdigest() == '2c14940b0bbcb78b57ac9c6af126b3905907168c5b2315786f8f789dcc4ba52a'
          pathlib.Path('/tmp/folder-index.patch').write_bytes(data)
          subprocess.run(['git','apply','--check','/tmp/folder-index.patch'],check=True)
          subprocess.run(['git','apply','/tmp/folder-index.patch'],check=True)
          subprocess.run(['python','.folder-index-fix.py'],check=True)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and browser test dependencies
        run: |
          pip install -r requirements.txt playwright PyYAML
          python -m playwright install --with-deps chromium
          npm install --no-save --package-lock=false --ignore-scripts jsdom@26
      - name: JavaScript regressions
        id: node
        continue-on-error: true
        run: |
          set -o pipefail
          node --check static/app.js
          node --test tests/*.test.cjs 2>&1 | tee /tmp/folder-index-node.log
      - name: Catalogue and application integration tests
        id: python
        continue-on-error: true
        env:
          PYTHONPATH: '.:tests'
          DATA_DIR: /tmp/fjordlens-test-data
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/folder-index-python.log
          import pathlib, subprocess, sys
          names = set('test_folder_index test_folder_index_api test_folder_previews test_folder_move test_gallery_browse test_video_autoplay_settings test_upload_conversion_uploader'.split())
          changed = subprocess.check_output(['git','diff','--name-only','3123ec3ad374b2bf1dedef1eb0a52d0823611198','9885108bc56d05da78a0857aec447979be2937f2','--','tests/test_*.py'],text=True)
          names.update(pathlib.Path(p).stem for p in changed.splitlines() if pathlib.Path(p).is_file())
          sys.exit(subprocess.call([sys.executable,'-m','unittest','-v',*sorted(names)]))
          PY
      - name: Real browser navigation regressions
        id: browser
        continue-on-error: true
        env:
          PYTHONPATH: '.:tests'
          DATA_DIR: /tmp/fjordlens-browser-data
        run: |
          set -o pipefail
          python -m unittest -v test_gallery_navigation_browser test_folder_previews_browser 2>&1 | tee /tmp/folder-index-browser.log
      - name: Collect validation evidence
        if: always()
        run: |
          mkdir -p /tmp/folder-index-result/tests /tmp/folder-index-result/static
          cp /tmp/folder-index-*.log /tmp/folder-index-result/ || true
          cp app.py folder_index.py wsgi.py /tmp/folder-index-result/ || true
          cp static/app.js /tmp/folder-index-result/static/
          cp tests/*.py tests/*.cjs /tmp/folder-index-result/tests/
          git status --short > /tmp/folder-index-result/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folder-index-validation
          path: /tmp/folder-index-result/
          retention-days: 3
      - name: Publish only verified implementation to feature branch
        if: steps.node.outcome == 'success' && steps.python.outcome == 'success' && steps.browser.outcome == 'success'
        run: |
          git add app.py static/app.js wsgi.py folder_index.py docs/folder-index.md tests/*.py tests/*.cjs
          git rm .folder-index-part-*.b64 .folder-index-corrections.json .folder-index-fix.py
          git commit -m 'Integrate folder catalogue with current security fixes after full validation'
          git push origin HEAD:perf/folder-index
      - name: Require all checks to pass
        if: always()
        env:
          NODE_RESULT: '${{ steps.node.outcome }}'
          PYTHON_RESULT: '${{ steps.python.outcome }}'
          BROWSER_RESULT: '${{ steps.browser.outcome }}'
        run: |
          test "$NODE_RESULT" = success && test "$PYTHON_RESULT" = success && test "$BROWSER_RESULT" = success
